name: Bundle Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  bundle-audit:
    uses: ./.github/workflows/build.yml
    with:
      description: "Check bundle for known CVEs"
      command: "rake bundle:audit"
